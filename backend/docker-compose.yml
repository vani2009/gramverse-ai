version: '3.8'

services:
  backend:
    build: .
    container_name: gramverse_backend
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEBUG=True
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gramverse_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      - db
      - redis

  db:
    image: postgis/postgis:15-3.3
    container_name: gramverse_postgis
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gramverse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gramverse_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  uploads_data:
